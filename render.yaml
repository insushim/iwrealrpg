services:
  - type: web
    name: wordquest-online
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: ACCEPT_LICENSE
        value: "true"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "10000"
      - key: NAME
        value: "WordQuest Online"
      - key: MAX_PLAYERS
        value: "50"
      - key: GVER
        value: "1.0.0"
      - key: NODE_ENV
        value: "production"
      - key: SSL
        value: "true"
      - key: CLIENT_REMOTE_HOST
        value: "wordquest-online.onrender.com"
      # MongoDB Atlas Configuration
      - key: SKIP_DATABASE
        value: "true"
      - key: DATABASE
        value: "mongodb"
      - key: MONGODB_SRV
        value: "true"
      - key: MONGODB_TLS
        value: "true"
      - key: MONGODB_PORT
        value: "0"
      - key: MONGODB_DATABASE
        value: "wordquest"
      - key: MONGODB_AUTH_SOURCE
        value: ""
      # >>> Set these from your MongoDB Atlas dashboard <<<
      - key: MONGODB_HOST
        sync: false
      - key: MONGODB_USER
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
